name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
            cmake_args: ""
          - name: Linux / GCC
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset dev ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev
